name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libdbus-1-3 libxcursor1 libxi6
      - name: Install
        run: python -m pip install -e ".[dev]" pyright
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Format (Markdown)
        run: npx --yes prettier --check "**/*.md"
      - name: Markdown lint
        run: npx --yes markdownlint-cli "**/*.md" --ignore "**/node_modules/**"
      - name: Types
        run: python -m pyright
      - name: Tests
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

  freeze:
    name: freeze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Freeze the minimal example
        run: python -m pytest -m freeze

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
